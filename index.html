<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeta - Asisten AI serbaguna</title>
<style>
  :root {
    --ungu: #6d4aff;
    --ungu-tua: #5836e0;
    --bubble-ai: #f0edfb;
    --teks: #1f1f2e;
    --abu: #6b6b7b;
    --garis: #e6e4ee;
    --latar: #fafaf9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--latar); color: var(--teks); font-size: 16px; line-height: 1.55;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--garis);
  }
  .logo {
    width: 42px; height: 42px; border-radius: 10px; background: var(--ungu); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex: none;
  }
  .judul { font-weight: 700; font-size: 18px; line-height: 1.2; }
  .sub { font-size: 13px; color: var(--abu); }
  .spasi { flex: 1; }
  #baru {
    border: 1px solid var(--garis); background: #fff; color: var(--teks); border-radius: 10px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #baru:hover { background: #f4f2fb; }

  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; scroll-behavior: smooth; }
  .kolom { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .kosong { text-align: center; padding: 48px 8px 8px; }
  .kosong h1 { margin: 0 0 6px; font-size: 26px; }
  .kosong p { margin: 0 0 22px; color: var(--abu); }
  .saran { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .saran button {
    border: 1px solid var(--garis); background: #fff; color: var(--teks); border-radius: 999px;
    padding: 9px 16px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .saran button:hover { border-color: var(--ungu); color: var(--ungu); }

  .baris { display: flex; }
  .baris.user { justify-content: flex-end; }
  .bubble { padding: 12px 18px; border-radius: 20px; word-wrap: break-word; overflow-wrap: anywhere; }
  .user .bubble { background: var(--ungu); color: #fff; max-width: 80%; white-space: pre-wrap; border-bottom-right-radius: 8px; }
  .ai .bubble { background: var(--bubble-ai); max-width: 94%; border-bottom-left-radius: 8px; }
  .galat .bubble { background: #fdecec; color: #8a1c1c; max-width: 94%; }

  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 16px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 1.4em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--ungu-tua); }
  .md hr { border: 0; border-top: 1px solid #d9d4ee; margin: 14px 0; }
  .md blockquote { margin: 0 0 10px; padding: 2px 14px; border-left: 4px solid #cfc7ee; color: #4a4a5a; }
  .md code { background: #e4dff7; padding: 1px 6px; border-radius: 5px; font-size: 0.9em; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .md pre { position: relative; background: #1e1e2e; color: #eaeaf5; padding: 14px 16px; border-radius: 12px; overflow-x: auto; margin: 0 0 12px; }
  .md pre code { background: none; padding: 0; color: inherit; font-size: 0.88em; }
  .md table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid #d3cde9; padding: 6px 12px; text-align: left; }
  .md th { background: #e4dff7; }
  .salin-kode {
    position: absolute; top: 8px; right: 8px; border: 0; border-radius: 6px; padding: 4px 10px;
    background: #3a3a52; color: #fff; font-size: 12px; cursor: pointer;
  }

  .berkas { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .kartu {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid #d9d4ee; border-radius: 14px; padding: 10px 14px;
  }
  .ikon { width: 38px; height: 38px; border-radius: 9px; background: #ece8fb; color: var(--ungu-tua);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; text-transform: uppercase; }
  .info { flex: 1; min-width: 140px; }
  .info .nama { font-weight: 600; word-break: break-all; }
  .info .ukuran { font-size: 12px; color: var(--abu); }
  .tombol { display: flex; gap: 8px; flex-wrap: wrap; }
  .tombol button {
    border: 1px solid var(--garis); background: #fff; color: var(--teks); border-radius: 9px;
    padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tombol button.utama { background: var(--ungu); border-color: var(--ungu); color: #fff; font-weight: 600; }
  .tombol button.utama:hover { background: var(--ungu-tua); }
  .tombol button:disabled { opacity: .6; cursor: wait; }
  .catatan { font-size: 13px; color: #8a5a00; margin-top: 8px; }

  .titik { display: inline-flex; gap: 5px; padding: 4px 0; }
  .titik i { width: 8px; height: 8px; border-radius: 50%; background: #9a8de0; animation: kedip 1.2s infinite ease-in-out; }
  .titik i:nth-child(2) { animation-delay: .2s; } .titik i:nth-child(3) { animation-delay: .4s; }
  @keyframes kedip { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  footer { padding: 12px 16px 16px; background: #fff; border-top: 1px solid var(--garis); }
  .form { max-width: 960px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; border: 1px solid #d6d3e2; border-radius: 22px; padding: 13px 18px;
    font: inherit; max-height: 160px; outline: none; background: #fff; color: var(--teks);
  }
  #input:focus { border-color: var(--ungu); box-shadow: 0 0 0 3px #6d4aff22; }
  #kirim {
    border: 0; background: var(--ungu); color: #fff; font: inherit; font-weight: 700;
    border-radius: 22px; padding: 13px 24px; cursor: pointer; flex: none;
  }
  #kirim:hover { background: var(--ungu-tua); }
  #kirim:disabled { opacity: .55; cursor: not-allowed; }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    .user .bubble { max-width: 90%; }
    .ai .bubble { max-width: 100%; }
    #kirim { padding: 13px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Z</div>
  <div>
    <div class="judul">Zeta</div>
    <div class="sub">Asisten AI serbaguna</div>
  </div>
  <div class="spasi"></div>
  <button id="baru" type="button" title="Mulai percakapan baru">Chat baru</button>
</header>

<main id="chat">
  <div class="kolom" id="kolom">
    <div class="kosong" id="kosong">
      <h1>Halo, aku Zeta 👋</h1>
      <p>Tanya apa saja, atau minta aku membuatkan file untukmu.</p>
      <div class="saran" id="saran"></div>
    </div>
  </div>
</main>

<footer>
  <div class="form">
    <textarea id="input" rows="1" placeholder="Tulis pesan untuk Zeta..." autocomplete="off"></textarea>
    <button id="kirim" type="button">Kirim</button>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function () {
  "use strict";

  var URL_XLSX = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  var URL_PDF = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";

  var chat = document.getElementById("chat");
  var kolom = document.getElementById("kolom");
  var kosong = document.getElementById("kosong");
  var input = document.getElementById("input");
  var tombolKirim = document.getElementById("kirim");
  var riwayat = [];
  var sedangKirim = false;

  var SARAN = [
    "Berita terbaru hari ini",
    "Cuaca Jakarta hari ini",
    "Buatkan website profil sederhana dalam satu file HTML",
    "Buatkan jadwal belajar mingguan dalam Excel",
    "Jelaskan cara kerja AI dengan bahasa sederhana"
  ];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ---------- Markdown ---------- */
  function renderMd(md) {
    if (window.marked && window.DOMPurify) {
      try {
        var html = window.marked.parse(md, { breaks: true, gfm: true });
        return window.DOMPurify.sanitize(html);
      } catch (e) { /* jatuh ke teks biasa */ }
    }
    return esc(md).replace(/\n/g, "<br>");
  }

  function percantik(el) {
    var links = el.querySelectorAll("a");
    for (var i = 0; i < links.length; i++) {
      links[i].target = "_blank";
      links[i].rel = "noopener noreferrer";
    }
    var pres = el.querySelectorAll("pre");
    pres.forEach(function (pre) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "salin-kode"; b.textContent = "Salin";
      b.addEventListener("click", function () {
        var code = pre.querySelector("code");
        salinTeks((code || pre).innerText, b);
      });
      pre.appendChild(b);
    });
  }

  function salinTeks(teks, tombol) {
    var asli = tombol.textContent;
    function selesai(ok) {
      tombol.textContent = ok ? "Tersalin" : "Gagal";
      setTimeout(function () { tombol.textContent = asli; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks).then(function () { selesai(true); }, function () { selesai(false); });
    } else {
      var t = document.createElement("textarea");
      t.value = teks; document.body.appendChild(t); t.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      t.remove(); selesai(ok);
    }
  }

  /* ---------- Blok file [[FILE: nama]] ... [[/FILE]] ---------- */
  var POLA_FILE = /\[\[FILE:\s*([^\]\n]+?)\s*\]\]\r?\n?([\s\S]*?)(?:\r?\n?\[\[\/FILE\]\]|$)/g;

  function namaAman(n) {
    n = String(n).replace(/[\\\/:*?"<>|\r\n]/g, "-").trim().slice(0, 100);
    if (!n) n = "file";
    if (!/\.[A-Za-z0-9]{1,6}$/.test(n)) n += ".txt";
    return n;
  }

  function lepasPagar(isi) {
    var m = isi.match(/^\s*```[\w+-]*\r?\n([\s\S]*?)\r?\n```\s*$/);
    return m ? m[1] : isi;
  }

  function pisahFile(teks) {
    var files = [], bersih = "", idx = 0, m;
    POLA_FILE.lastIndex = 0;
    while ((m = POLA_FILE.exec(teks)) !== null) {
      bersih += teks.slice(idx, m.index);
      files.push({
        nama: namaAman(m[1]),
        isi: lepasPagar(m[2]),
        utuh: /\[\[\/FILE\]\]$/.test(m[0])
      });
      idx = m.index + m[0].length;
      if (m[0].length === 0) POLA_FILE.lastIndex++;
    }
    bersih += teks.slice(idx);
    return { teks: bersih.trim(), files: files };
  }

  /* ---------- Unduh file ---------- */
  var MIME = {
    html: "text/html", htm: "text/html", css: "text/css", js: "text/javascript", json: "application/json",
    csv: "text/csv", md: "text/markdown", txt: "text/plain", svg: "image/svg+xml", xml: "application/xml",
    py: "text/x-python", java: "text/x-java", c: "text/x-c", cpp: "text/x-c++", php: "text/x-php", sql: "text/plain"
  };

  function ekstensi(nama) {
    var p = nama.split(".");
    return p.length > 1 ? p.pop().toLowerCase() : "";
  }

  function simpanBlob(blob, nama) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nama;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  var _skrip = {};
  function muatSkrip(url) {
    if (!_skrip[url]) {
      _skrip[url] = new Promise(function (ok, gagal) {
        var s = document.createElement("script");
        s.src = url; s.onload = ok;
        s.onerror = function () { delete _skrip[url]; gagal(new Error("Gagal memuat pustaka")); };
        document.head.appendChild(s);
      });
    }
    return _skrip[url];
  }

  function unduhDoc(f) {
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>' + esc(f.nama) + '</title>' +
      '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 8px}</style>' +
      '</head><body>' + renderMd(f.isi) + '</body></html>';
    simpanBlob(new Blob(["\ufeff" + html], { type: "application/msword" }), f.nama.replace(/\.docx$/i, ".doc"));
  }

  function unduhXlsx(f) {
    return muatSkrip(URL_XLSX).then(function () {
      var wb = window.XLSX.read(f.isi, { type: "string" });
      window.XLSX.writeFile(wb, f.nama.replace(/\.xls$/i, ".xlsx"));
    });
  }

  function unduhPdf(f) {
    return muatSkrip(URL_PDF).then(function () {
      var el = document.createElement("div");
      el.style.cssText = "width:700px;padding:24px;background:#fff;color:#111;font:14px/1.6 Arial,sans-serif";
      el.innerHTML = renderMd(f.isi);
      return window.html2pdf().set({
        margin: 12, filename: f.nama,
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      }).from(el).save();
    });
  }

  function unduh(f, tombol) {
    var ext = ekstensi(f.nama);
    var kerja;
    if (ext === "pdf") kerja = unduhPdf(f);
    else if (ext === "xlsx" || ext === "xls") kerja = unduhXlsx(f);
    else if (ext === "docx") kerja = Promise.resolve(unduhDoc(f));
    else {
      simpanBlob(new Blob([f.isi], { type: (MIME[ext] || "text/plain") + ";charset=utf-8" }), f.nama);
      return;
    }
    var label = tombol.textContent;
    tombol.disabled = true; tombol.textContent = "Menyiapkan...";
    kerja.catch(function (e) {
      alert("Gagal membuat file " + ext.toUpperCase() + " (" + e.message + "). File diunduh sebagai teks biasa.");
      simpanBlob(new Blob([f.isi], { type: "text/plain;charset=utf-8" }), f.nama + ".txt");
    }).then(function () {
      tombol.disabled = false; tombol.textContent = label;
    });
  }

  function formatUkuran(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  function buatKartu(f) {
    var ext = ekstensi(f.nama);
    var kartu = document.createElement("div");
    kartu.className = "kartu";

    var ikon = document.createElement("div");
    ikon.className = "ikon"; ikon.textContent = (ext || "file").slice(0, 4);

    var info = document.createElement("div");
    info.className = "info";
    var nm = document.createElement("div"); nm.className = "nama"; nm.textContent = f.nama;
    var uk = document.createElement("div"); uk.className = "ukuran";
    uk.textContent = formatUkuran(new Blob([f.isi]).size) + (f.utuh ? "" : " · terpotong");
    info.appendChild(nm); info.appendChild(uk);

    var tb = document.createElement("div");
    tb.className = "tombol";

    var bUnduh = document.createElement("button");
    bUnduh.type = "button"; bUnduh.className = "utama"; bUnduh.textContent = "Unduh";
    bUnduh.addEventListener("click", function () { unduh(f, bUnduh); });
    tb.appendChild(bUnduh);

    if (ext === "html" || ext === "htm" || ext === "svg") {
      var bBuka = document.createElement("button");
      bBuka.type = "button"; bBuka.textContent = "Buka";
      bBuka.addEventListener("click", function () {
        var url = URL.createObjectURL(new Blob([f.isi], { type: (MIME[ext] || "text/html") + ";charset=utf-8" }));
        window.open(url, "_blank", "noopener");
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      });
      tb.appendChild(bBuka);
    }

    var bSalin = document.createElement("button");
    bSalin.type = "button"; bSalin.textContent = "Salin";
    bSalin.addEventListener("click", function () { salinTeks(f.isi, bSalin); });
    tb.appendChild(bSalin);

    kartu.appendChild(ikon); kartu.appendChild(info); kartu.appendChild(tb);
    return kartu;
  }

  /* ---------- Tampilan pesan ---------- */
  function sembunyikanKosong() {
    if (kosong && kosong.parentNode) { kosong.remove(); kosong = null; }
  }

  function turunKeBawah() { chat.scrollTop = chat.scrollHeight; }

  function tambahUser(teks) {
    var baris = document.createElement("div"); baris.className = "baris user";
    var b = document.createElement("div"); b.className = "bubble"; b.textContent = teks;
    baris.appendChild(b); kolom.appendChild(baris);
    turunKeBawah();
  }

  function tambahAI(teks, terpotong) {
    var hasil = pisahFile(teks);
    var baris = document.createElement("div"); baris.className = "baris ai";
    var b = document.createElement("div"); b.className = "bubble";

    if (hasil.teks) {
      var md = document.createElement("div"); md.className = "md";
      md.innerHTML = renderMd(hasil.teks);
      percantik(md);
      b.appendChild(md);
    }
    if (hasil.files.length) {
      var wadah = document.createElement("div"); wadah.className = "berkas";
      hasil.files.forEach(function (f) { wadah.appendChild(buatKartu(f)); });
      b.appendChild(wadah);
    }
    if (terpotong) {
      var c = document.createElement("div"); c.className = "catatan";
      c.textContent = 'Jawaban terpotong karena terlalu panjang. Ketik "lanjutkan" untuk melanjutkan.';
      b.appendChild(c);
    }
    if (!hasil.teks && !hasil.files.length) b.textContent = "(kosong)";

    baris.appendChild(b); kolom.appendChild(baris);
    // tampilkan dari awal jawaban agar enak dibaca
    baris.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  function tambahGalat(pesan) {
    var baris = document.createElement("div"); baris.className = "baris galat";
    var b = document.createElement("div"); b.className = "bubble"; b.textContent = pesan;
    baris.appendChild(b); kolom.appendChild(baris);
    turunKeBawah();
  }

  function tambahLoading() {
    var baris = document.createElement("div"); baris.className = "baris ai";
    var b = document.createElement("div"); b.className = "bubble";
    b.innerHTML = '<span class="titik"><i></i><i></i><i></i></span>';
    baris.appendChild(b); kolom.appendChild(baris);
    turunKeBawah();
    return baris;
  }

  /* ---------- Kirim pesan ---------- */
  function potongRiwayat() {
    while (riwayat.length > 38) riwayat.shift();
    while (riwayat.length && riwayat[0].role !== "user") riwayat.shift();
  }

  function aturInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  function kirim(teks) {
    teks = String(teks || "").trim();
    if (!teks || sedangKirim) return;

    sembunyikanKosong();
    tambahUser(teks);
    riwayat.push({ role: "user", content: teks });
    potongRiwayat();

    input.value = ""; aturInput();
    sedangKirim = true; tombolKirim.disabled = true;
    var loading = tambahLoading();

    fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: riwayat })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (!r.ok) throw new Error(data.error || "Terjadi gangguan (" + r.status + ")");
          return data;
        });
      })
      .then(function (data) {
        loading.remove();
        riwayat.push({ role: "assistant", content: data.text });
        tambahAI(data.text, data.terpotong);
      })
      .catch(function (e) {
        loading.remove();
        riwayat.pop();
        tambahGalat(e.message || "Gagal terhubung. Coba lagi.");
        input.value = teks; aturInput();
      })
      .then(function () {
        sedangKirim = false; tombolKirim.disabled = false; input.focus();
      });
  }

  function chatBaru() {
    if (sedangKirim) return;
    riwayat = [];
    kolom.innerHTML = "";
    kosong = document.createElement("div");
    kosong.className = "kosong"; kosong.id = "kosong";
    kosong.innerHTML = '<h1>Halo, aku Zeta 👋</h1><p>Tanya apa saja, atau minta aku membuatkan file untukmu.</p><div class="saran" id="saran"></div>';
    kolom.appendChild(kosong);
    isiSaran();
    input.focus();
  }

  function isiSaran() {
    var w = document.getElementById("saran");
    if (!w) return;
    SARAN.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = s;
      b.addEventListener("click", function () { kirim(s); });
      w.appendChild(b);
    });
  }

  input.addEventListener("input", aturInput);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      kirim(input.value);
    }
  });
  tombolKirim.addEventListener("click", function () { kirim(input.value); });
  document.getElementById("baru").addEventListener("click", chatBaru);

  isiSaran();
  input.focus();
})();
</script>
</body>
