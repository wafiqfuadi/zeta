<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeta</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fafaf7;color:#1f2328;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 18px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:#6d4aff;color:#fff;display:grid;place-items:center;font-weight:700}
header span{display:block;font-size:12px;color:#6b7280}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#6d4aff;color:#fff}
.b{align-self:flex-start;background:#f0eefc}
.hint{color:#6b7280;text-align:center;margin:auto}
footer{background:#fff;border-top:1px solid #e5e7eb;padding:10px 14px}
.row{display:flex;gap:8px;max-width:760px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid #e5e7eb;border-radius:14px;padding:10px 12px;font:inherit}
button{border:0;background:#6d4aff;color:#fff;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header><div class="logo">Z</div><div><b>Zeta</b><span>Asisten AI serbaguna</span></div></header>
<div id="log"><div class="hint" id="hint">Halo, aku Zeta. Tanya apa saja atau minta bantuan mengerjakan tugas.</div></div>
<footer><div class="row"><textarea id="in" rows="1" placeholder="Tulis pesan untuk Zeta…"></textarea><button id="send">Kirim</button></div></footer>
<script>
const log=document.getElementById("log"),inp=document.getElementById("in"),btn=document.getElementById("send");
let hist=[],busy=false;
function add(role,text){const d=document.createElement("div");d.className="m "+role;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const text=inp.value.trim();if(!text||busy)return;
  const h=document.getElementById("hint");if(h)h.remove();
  inp.value="";busy=true;btn.disabled=true;
  add("u",text);hist.push({role:"user",content:text});
  const out=add("b","…");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:hist})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Gagal");
    out.textContent=d.text;hist.push({role:"assistant",content:d.text});
  }catch(e){out.textContent="Maaf, ada gangguan: "+e.message;hist.pop()}
  busy=false;btn.disabled=false;inp.focus();
}
btn.onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body>
</html>
